<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>המרתף המקולל</title>
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; background: #0a0a12; }
      #root { display: flex; justify-content: center; }
      #root > div { width: 100%; max-width: 480px; height: 100%; }
    </style>
  </head>
  <body>
    <script>
      window.__errors = [];
      window.onerror = function (msg, src, line, col, err) {
        window.__errors.push(String(msg) + ' @' + line + ':' + col + ' ' + (err && err.stack));
      };
      window.addEventListener('unhandledrejection', function (e) {
        window.__errors.push('unhandledrejection: ' + (e.reason && e.reason.stack || e.reason));
      });
    </script>
    <div id="root"></div>
  </body>
</html>
